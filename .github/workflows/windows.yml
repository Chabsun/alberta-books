name: Windows

# Builds and tests Alberta Books on a real Windows machine, then produces the
# installer (Alberta-Books-Setup-<version>.exe). Download it from the run's
# "Artifacts" section. Pushing a tag like v0.1.0 also attaches it to a release.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (ledger, GST, reports, import, backups)
        run: npm test

      - name: Build app
        run: npm run build

      - name: End-to-end test of the real app on Windows
        run: node e2e/screens.mjs

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Alberta-Books-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Alberta-Books-Windows-installer
          path: installer
      - name: Create release with the installer
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.exe --repo "$GITHUB_REPOSITORY" \
            --title "Alberta Books $GITHUB_REF_NAME" \
            --notes "Windows installer. Unsigned: if SmartScreen warns, choose More info, then Run anyway."
        env:
          GH_TOKEN: ${{ github.token }}
